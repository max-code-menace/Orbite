<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0820" />
    <title>Orbite</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <div id="etiquettes"></div>

    <header id="profil" class="verre"></header>

    <!-- La bande « amis » : flèches précédent / suivant et amis du système affiché (remplie par amis.js) -->
    <nav id="amis" aria-label="Voyager vers un autre système">
      <button class="amis-fleche" type="button" data-sens="-1" aria-label="Système précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="amis-liste"></div>
      <button class="amis-fleche" type="button" data-sens="1" aria-label="Système suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>

    <section id="acces" class="verre" aria-label="Accès rapide">
      <button class="acces-entete" type="button" aria-label="Ouvrir ou fermer l'Accès rapide">
        <span class="acces-poignee"></span>
        <span class="acces-titre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#ffd34d"/></svg>
          Accès rapide
        </span>
      </button>
      <nav class="acces-liste"></nav>
    </section>

    <section id="panneau" class="verre" hidden aria-live="polite">
      <span class="acces-poignee"></span>
      <div class="panneau-entete">
        <span class="panneau-icone"></span>
        <!-- biome-ignore lint/a11y/useHeadingContent: le titre est rempli par ui.js à l'ouverture -->
        <h2 class="panneau-titre"></h2>
        <button class="panneau-fermer" type="button" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="panneau-description"></p>
      <div class="panneau-liens"></div>
      <button class="panneau-changer" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>
        Changer de décor
      </button>
    </section>
    <!-- L'écran d'accueil (montré une fois par appareil, voir accueil.js) -->
    <section id="accueil" hidden aria-label="Bienvenue sur Orbite">
      <div class="accueil-carte">
        <h1 class="accueil-titre">Orbite</h1>
        <p class="accueil-texte">Explore des univers, découvre des créateurs et partage le tien.</p>
        <button class="ft-bouton" type="button" data-action="commencer">Commencer</button>
        <button class="accueil-lien" type="button" data-action="faislETien">✨ Fais le tien</button>
      </div>
    </section>
    <div id="fps" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
