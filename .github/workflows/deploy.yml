# Vérifie la page à chaque envoi de code, et la met en ligne seulement si tout passe.
#
# - Sur n'importe quelle branche : niveau 3 de scripts/check.mjs (format, linter, tests
#   rapides, secrets, audit des dépendances, données, construction, test téléphone et
#   tablette ; captures téléchargeables dans « Artifacts »).
# - Sur la branche principale du dépôt uniquement : mise en ligne sur GitHub Pages.
#   Si un test échoue, la mise en ligne n'a pas lieu : la page en ligne reste l'ancienne.
name: Vérification et mise en ligne

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Niveau 3 : format, linter, tests rapides, secrets, audit des dépendances,
      # puis vérification des données, construction et test téléphone + tablette.
      - name: Tout vérifier (niveau 3)
        run: npm run check -- --ci
      - name: Garder les captures d'écran du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-test
          path: test-resultats/
          if-no-files-found: ignore
      - name: Préparer la mise en ligne
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  mettre-en-ligne:
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
